<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 res;uniform float time,reliefAmt,ridgeAmt,reflectAmt,specAmt,lensAmt;uniform float scene[5];uniform float sceneP[6];uniform float cellAmt;  // 青,黄金,ミトコンドリア,モルフォ,スチームパンク の重み
uniform sampler2D hTex;uniform sampler2D fluidTex;uniform float fluidAmt;uniform float heightPass,depthAmt,boilAmt,flowK,glowAmt,monoAmt,pastelAmt,liquidAmt;
uniform vec3 cores[4];uniform vec2 vels[4];uniform float spins[4];uniform vec2 lagCores[4];uniform float wrapW;uniform float tidePh[4];uniform float tideA[4];uniform float tideLvl;uniform float tideT,tideAmt,pulse,peri,nonlin,rdAmt,lite;uniform vec2 jitter;uniform sampler2D rdTex;
float hash21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float tanh_(float x){x=clamp(x,-10.,10.);float e=exp(2.*x);return (e-1.)/(e+1.);}
vec2 tanh2(vec2 v){return vec2(tanh_(v.x),tanh_(v.y));}
// 結晶の面：ボロノイのセルごとに一定の勾配（区分的平面）。面の境目で法線が折れる
float facets(vec2 p){
 vec2 q=p*1.6;vec2 c=floor(q);float best=1e9;vec2 bc=vec2(0.);
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 id=c+vec2(float(x),float(y));vec2 pt=id+vec2(hash21(id),hash21(id+5.));float d=length(q-pt);if(d<best){best=d;bc=pt;}}
 vec2 g=(vec2(hash21(bc+11.),hash21(bc+17.))-.5)*.9;
 return dot(q-bc,g);
}
float noise2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int k=0;k<4;k++){s+=a*noise2(p);p=mat2(.8,-.6,.6,.8)*p*2.03+3.7;a*=.5;}return s;}
// 稜線ノイズ：谷ではなく尾根が鋭くなる。光が走る線はここから出る
float ridged(vec2 p){float s=0.,a=.5;for(int k=0;k<4;k++){float n=1.-abs(2.*noise2(p)-1.);s+=a*n*n;p=mat2(.8,-.6,.6,.8)*p*2.2+1.3;a*=.55;}return s;}
// 高さ場：広いうねり ＋ 細かい稜線 ＋ 渦（椀状に沈み、縁がわずかに盛り上がる）
// 分潮：振幅比 M2:S2:K1:O1 ≈ 1:.46:.58:.41、周期は時間単位「1日」で 12.42h/12.00h/23.93h/25.82h。波数ベクトルは各分潮で向きを変える
float tide(vec2 p,float T){
 const float TAU=6.2831853;
 float d=T;                                   // T は「日」
 const float EPS=.22;                          // Stokes 2次項の比。峰が尖り、谷が平らになる
 // 位相と振幅はJSから（架空の潮、または東京の調和定数から計算した実際の潮）
 float t1=tidePh[0]+dot(p,vec2(.55,.30));
 float t2=tidePh[1]+dot(p,vec2(-.40,.45));
 float t3=tidePh[2]+dot(p,vec2(.20,-.60));
 float t4=tidePh[3]+dot(p,vec2(-.62,-.18));
 float m2=cos(t1)+EPS*cos(2.*t1), s2=cos(t2)+EPS*cos(2.*t2), k1=cos(t3)+EPS*cos(2.*t3), o1=cos(t4)+EPS*cos(2.*t4);
 return (tideA[0]*m2+tideA[1]*s2+tideA[2]*k1+tideA[3]*o1)/(2.45*(1.+EPS));
}
// 瑪瑙の縞：渦のまわりの距離を幅の違う硬い帯に量子化。x=段差の高さ、y=帯ごとの色の明暗
// 左右の周期境界：渦との差は、いちばん近い写し（左右に幅ぶんずらした渦）で測る
vec2 wd(vec2 d){if(wrapW>0.)d.x-=wrapW*floor(d.x/wrapW+.5);return d;}
vec2 agate(vec2 p){
 float step_=0.,tint=0.,wsum=0.;
 for(int i=0;i<4;i++){
  vec2 d=wd(p-cores[i].xy);float L=length(d)/cores[i].z;
  float ang=atan(d.y,d.x);
  float u=L*4.5+.35*sin(ang*3.+float(i))+.5*fbm(p*1.2+float(i)*3.);   // 帯の位相（少し歪ませる）
  float b=floor(u),f=fract(u);
  float width=.4+.5*hash21(vec2(b,float(i)));                           // 帯の幅はばらつく
  float edge=smoothstep(.0,.06,f)*(1.-smoothstep(width,width+.06,f));   // 硬い縁
  float w=exp(-pow(max(L-1.1,0.)/.9,2.))*smoothstep(1.0,1.2,L);
  step_+=w*(hash21(vec2(b+7.,float(i)))-.5)*.5*edge;
  tint+=w*(hash21(vec2(b+3.,float(i)))-.5)*edge;wsum+=w;
 }
 return vec2(step_,tint);
}
// 風波：ω²=g·k の分散関係を持つ12成分。長い波ほど速い。振幅はk⁻²（Phillips型）。主方向±35°に散らす
uniform float waveAmt;
float windWaves(vec2 p,float t){
 // 渦の椀＝浅い場所：波数を局所的に増やす（波長が縮み、渦のまわりで波が曲がる）
 vec2 pw=p;
 vec2 U=vec2(0.);                                            // 渦が誘導する流れ（正則化した点渦）
 for(int i=0;i<4;i++){vec2 d=wd(p-cores[i].xy);float L=length(d)/cores[i].z;float w=exp(-L*L*.3);pw+=d*w*.35;
  float handed=(mod(float(i),2.)<.5)?1.:-1.;float G=handed*cores[i].z*cores[i].z*11.0;
  for(int m=-1;m<=1;m++){if(m!=0&&wrapW<=0.)continue;vec2 dm=p-cores[i].xy-vec2(float(m)*wrapW,0.);   // 周期のときは左右の写しも足す（継ぎ目が出ない）
   U+=G/6.2831853*vec2(-dm.y,dm.x)/(dot(dm,dm)+cores[i].z*cores[i].z*.8);}}
 U=tanh2(U*1.5)/1.5;                                          // 有界化
 float sum=0.,norm=0.;const float g=2.0;
 for(int j=0;j<12;j++){
  if(lite>.5&&j>=6)break;
  float fj=float(j);
  float k=1.0+4.0*pow(hash21(vec2(fj,1.)),1.5);                 // 波数 1〜5
  float th=.9+(hash21(vec2(fj,2.))-.5)*1.22;                     // 方向：主方向±35°
  float om=sqrt(g*k);                                            // 深水の分散関係
  float a=1./(k*k);                                              // Phillips型の振幅
  float ph=hash21(vec2(fj,3.))*6.2831853;
  vec2 kv=k*vec2(cos(th),sin(th));
  float omD=om+nonlin*dot(kv,U)*.9;                              // ドップラー：流れに乗る波は速く、逆らう波は遅い（＝前面で詰まる）
  float th_=dot(pw,kv)-omD*t+ph;
  sum+=a*(cos(th_)+.18*cos(2.*th_)*k*.35);                       // ここにも軽いStokes非対称
  norm+=a;
 }
 return sum/norm;
}
// 沸騰：奥から泡が湧き、膨らみながら手前にせり上がり、模様を外へ押し広げて、平らに戻る
// 戻り値 xy＝模様の押し出し、z＝高さ（せり上がり）
vec3 boil(vec2 p){
 if(boilAmt<.01)return vec3(0.);
 const float G=1.9;                                              // 泡の間隔：数を減らして大きく
 vec2 cell=floor(p/G);vec3 acc=vec3(0.);
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
  vec2 id=cell+vec2(float(x),float(y));
  vec2 c=(id+.2+.6*vec2(hash21(id+1.1),hash21(id+2.2)))*G;
  float rate=.06+.05*hash21(id+4.4);
  float cyc=time*rate*4.+hash21(id+.3);                           // 泡の周期（数秒〜十数秒）
  float ph=fract(cyc);
  c+=.25*(vec2(hash21(id+floor(cyc)*.37),hash21(id+floor(cyc)*.53+9.))-.5);   // 毎回少し違う場所から湧く
  float R=.45+.55*hash21(id+5.5+floor(cyc));
  float r=R*(.15+.85*sqrt(ph));                                    // 膨らむ
  vec2 d=p-c;float L=length(d);
  float k=exp(-pow(L/r,2.));
  float life=smoothstep(0.,.25,ph)*(1.-smoothstep(.55,1.,ph));     // 湧き上がり → 広がって沈む
  acc.z+=k*life*1.1;
  acc.xy+=d/max(L,1e-3)*k*life*r*.28;                             // 押し広げは控えめ（同心円の模様を作らない）
 }
 // 渦の目玉の中では湧かない
 float eyeK=1.;for(int i=0;i<4;i++){float Le=length(wd(p-cores[i].xy))/cores[i].z;eyeK*=smoothstep(1.4,2.4,Le);}
 return acc*boilAmt*eyeK;
}
vec2 warpQ(vec2 p){
 float t=time*.08*flowK;
 vec2 q=p;
 // 流体：素材がどこから運ばれてきたか（流れで積み重なった移流の地図）。模様はこの座標の上に描く
 if(fluidAmt>.01){vec2 uvf=(p/3.5*min(res.x,res.y)+.5*res)/res;q=mix(p,texture2D(fluidTex,clamp(uvf,0.,1.)).xy,fluidAmt);}
 // 渦が周囲の素材を引き込む：座標を渦のまわりで回転・収縮させ、進行方向と逆に引きずる
 for(int i=0;i<4;i++){

// 液体の塊：なめらかなボロノイ（指数で混ぜたF1）で、境目が溶け合ったドームを作る。境目は細い谷
float liquidH(vec2 q){
 // 流れの向きに引き伸ばした座標で、大きな塊をひとつの段だけ作る
 vec2 dir=normalize(vec2(fbm(q*.4+7.)-.5,fbm(q*.4+13.)-.5)+1e-3);
 vec2 a=vec2(dot(q,dir)*.6,dot(q,vec2(-dir.y,dir.x)));               // 流れ方向に約1.7倍長い
 vec2 x=a*1.35+.6*vec2(fbm(q*.6),fbm(q*.6+5.2));
 vec2 n=floor(x),f=fract(x);float r=0.;
 for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(float(i),float(j));vec2 o2=vec2(hash21(n+g),hash21(n+g+17.3))*.8+.1;r+=exp(-4.5*length(g+o2-f));}
 float F1=-log(r)/4.5;                                                // 小さいほど塊の中心（よく溶け合う）
 float top=smoothstep(.72,.10,F1);top=top*top*(3.-2.*top);                                     // てっぺんは平ら、縁で急に落ちる
 float lip=exp(-pow((F1-.52)/.10,2.))*.04;                             // 表面張力で縁がぷくっと立つ
 return top+lip+.025*fbm(x*2.3);                                       // ごく弱いさざ波
}

 if(liquidAmt>.01&&lite<.5)h+=liquidAmt*.55*liquidH(q);                 // 液体の塊の盛り上がり

 h+=(smoothstep(.06,.5,rdv)-.35)*.13*rdAmt*(1.+.8*scene[2])*(1.-.8*sceneP[5])*(1.-.9*liquidAmt);   // 陽光では細胞模様を控えめに

 float br=smoothstep(.1,.9,fract(th*.45));
